# Paths excluded from secret-scanning alerts.
#
# These files contain deliberately fake, self-labelled credential fixtures that
# are shaped like real LinkedIn tokens so the parsing and storage paths are
# exercised realistically. They are not real and never were. The naming
# (`-fake-`, `-fixture-`) is what makes them auditable, so they are excluded
# here rather than renamed into something that no longer tests the real shape.
paths-ignore:
  - tests/unit/secret-store.test.ts
  - tests/unit/linkedin-clients.test.ts
  - tests/integration/dashboard-destructive.test.ts
