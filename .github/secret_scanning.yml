# Paths excluded from secret-scanning alerts.
#
# These files contain deliberately fake, self-labelled credential fixtures that
# are shaped like real LinkedIn tokens so the parsing and storage paths are
# exercised realistically. They are not real and never were. The naming
# (`-fake-`, `-fixture-`) is what makes them auditable, so they are excluded
# here rather than renamed into something that no longer tests the real shape.
# The second group is different in kind and worth naming separately. Those
# files test the redactor, so a token shaped like a real provider's is the
# INPUT: each one is written into an artifact or an error and then asserted to
# be absent from what comes out. Removing them would delete the only evidence
# that redaction works. `xoxb-123456789012-abcdefghijklmn` in redaction.test.ts
# raised the first alert this repository ever got, which is the rule working as
# intended on a string that was never a credential.
paths-ignore:
  - tests/unit/secret-store.test.ts
  - tests/unit/linkedin-clients.test.ts
  - tests/integration/dashboard-destructive.test.ts
  - tests/unit/redaction.test.ts
  - tests/integration/content.test.ts
  - tests/integration/import.test.ts
  - tests/integration/onboarding-tools.test.ts
  - tests/integration/virtual-source-ingest.test.ts
